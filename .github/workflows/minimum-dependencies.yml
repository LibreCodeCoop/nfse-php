name: Minimum Dependencies

on: pull_request

permissions:
  contents: read

concurrency:
  group: minimum-dependencies-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  minimum-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.2"
          extensions: openssl, dom, soap
          coverage: none
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve minimum supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress

      - name: Run unit tests
        env:
          NFS_TEST_CNPJ: "11222333000181"
          NFS_SANDBOX: "true"
        run: composer run test:unit
