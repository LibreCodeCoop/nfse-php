name: NT009 Source Evidence

on:
  pull_request:
    paths:
      - "tools/**"
      - "composer.json"
      - "vendor-bin/domains/**"
      - "resources/domains/**"
      - ".github/workflows/nt009-evidence.yml"
      - ".github/actions/setup-project-php/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-official-evidence:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP from Composer
        uses: ./.github/actions/setup-project-php
        with:
          extensions: dom, mbstring, zip, gd, xml, xmlreader, xmlwriter, simplexml, fileinfo
      - name: Install isolated domain tooling
        run: composer --working-dir=vendor-bin/domains install --prefer-dist --no-progress --no-interaction
      - name: Verify original XLSX hashes and compare official NT009 data
        run: |
          php tools/bin/domains.php audit \
            --download-dir="${{ runner.temp }}/nt009" \
            --report="${{ runner.temp }}/nt009-comparison.json" \
            --print-layout=yes
      - name: Verify versioned Annex VII against all published XLSX rows
        run: php tools/bin/domains.php verify-indicators --annex-vii="${{ runner.temp }}/nt009/annex-vii-nt009.xlsx"
      - name: Observe official production Anexo I and compare full DPS layouts
        run: |
          php tools/bin/domains.php observe-source \
            --url="https://www.gov.br/nfse/pt-br/biblioteca/documentacao-tecnica/documentacao-atual/anexo_i-sefin_adn-dps_nfse-snnfse-v1-01-20260209.xlsx" \
            --output="${{ runner.temp }}/nt009/legacy-annex-i.xlsx" \
            --acknowledge-unpinned=yes
          php tools/bin/domains.php contract-matrix \
            --legacy-annex="${{ runner.temp }}/nt009/legacy-annex-i.xlsx" \
            --annex-vi="${{ runner.temp }}/nt009/annex-vi-nt009.xlsx" \
            --output="${{ runner.temp }}/nt009-dps-matrix.tsv"
          echo "MATRIX_TSV_BEGIN"
          cat "${{ runner.temp }}/nt009-dps-matrix.tsv"
          echo "MATRIX_TSV_END"
      - name: Retain full evidence for manual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nt009-official-source-evidence
          path: |
            ${{ runner.temp }}/nt009-comparison.json
            ${{ runner.temp }}/nt009-dps-matrix.tsv
            ${{ runner.temp }}/nt009/*.xlsx
          if-no-files-found: warn
          retention-days: 30
