name: NT009 Source Evidence

on:
  pull_request:
    paths:
      - "tools/**"
      - "composer.json"
      - "vendor-bin/domains/**"
      - "resources/domains/**"
      - ".github/workflows/nt009-evidence.yml"
      - ".github/actions/setup-project-php/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-official-evidence:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP from Composer
        uses: ./.github/actions/setup-project-php
        with:
          extensions: dom, mbstring, zip, gd, xml, xmlreader, xmlwriter, simplexml, fileinfo
      - name: Install isolated domain tooling
        run: composer --working-dir=vendor-bin/domains install --prefer-dist --no-progress --no-interaction
      - name: Verify original XLSX hashes and compare official NT009 data
        run: |
          php tools/bin/domains.php audit \
            --download-dir="${{ runner.temp }}/nt009" \
            --report="${{ runner.temp }}/nt009-comparison.json"
      - name: Verify all 40 published indicators match the versioned TSV
        run: |
          php -r '
            require "vendor-bin/domains/vendor/autoload.php";
            $generator = new LibreCodeCoop\NfsePHP\Tools\DomainTableGenerator();
            $rows = $generator->indicatorRows(getenv("RUNNER_TEMP") . "/nt009/annex-vii-nt009.xlsx");
            $path = "resources/domains/indicadores-operacao-ibscbs-v1.03.00.tsv";
            $snapshot = array_values(array_filter(
                explode("\n", trim(file_get_contents($path))),
                static fn (string $line): bool => $line !== "" && !str_starts_with($line, "#")
            ));
            $source = array_map(static fn (array $row): string => implode("\t", $row), $rows);
            if (count($source) !== 40 || $source !== $snapshot) {
                throw new UnexpectedValueException("Versioned Anexo VII differs from the official signed-off source");
            }
            echo "Official Anexo VII snapshot verified: 40/40 exact code/characteristic/location triplets\n";
          '
      - name: Retain full evidence for manual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nt009-official-source-evidence
          path: |
            ${{ runner.temp }}/nt009-comparison.json
            ${{ runner.temp }}/nt009/*.xlsx
          if-no-files-found: warn
          retention-days: 30
