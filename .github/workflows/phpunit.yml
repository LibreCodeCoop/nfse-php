name: PHPUnit

on: pull_request

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php-policy:
    name: PHP versions from root Composer
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      primary: ${{ steps.policy.outputs.primary }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read CI PHP matrix and primary from composer.json
        id: policy
        run: |
          php tools/bin/ci-php.php validate
          echo "matrix=$(php tools/bin/ci-php.php matrix)" >> "$GITHUB_OUTPUT"
          echo "primary=$(php tools/bin/ci-php.php primary)" >> "$GITHUB_OUTPUT"

  compatibility:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    needs: php-policy

    strategy:
      matrix:
        php-version: ${{ fromJSON(needs.php-policy.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP from Composer matrix
        uses: ./.github/actions/setup-project-php
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl, dom, soap
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        env:
          NFS_TEST_CNPJ: "11222333000181"
          NFS_SANDBOX: "true"
        run: composer run test:unit

      - name: Run integration tests when certificate secrets are present
        if: ${{ matrix.php-version == needs.php-policy.outputs.primary }}
        env:
          NFSE_CLIENT_CERT_B64: ${{ secrets.NFSE_CLIENT_CERT_B64 }}
          NFSE_CLIENT_KEY_B64: ${{ secrets.NFSE_CLIENT_KEY_B64 }}
          NFS_TEST_CNPJ: "11222333000181"
          NFS_SANDBOX: "true"
        run: |
          if [ -z "$NFSE_CLIENT_CERT_B64" ]; then
            echo "NFS-e integration certificate is not configured; skipping."
            exit 0
          fi
          composer run test:integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: php-policy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP from Composer primary
        uses: ./.github/actions/setup-project-php
        with:
          php-version: ${{ needs.php-policy.outputs.primary }}
          extensions: openssl, dom, soap
          coverage: xdebug
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate coverage
        env:
          XDEBUG_MODE: coverage
          NFS_TEST_CNPJ: "11222333000181"
          NFS_SANDBOX: "true"
        run: composer run test:coverage

      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vendor/bin/php-coveralls --coverage_clover=build/logs/clover.xml --json_path=build/logs/coveralls-upload.json -v

