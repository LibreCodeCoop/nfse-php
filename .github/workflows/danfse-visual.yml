name: DANFSe Visual Evidence

on:
  pull_request:
    paths:
      - 'src/Danfse/**'
      - 'tests/fixtures/nfse_exemplo.xml'
      - 'tools/bin/render-danfse-visual-fixtures.php'
      - '.github/workflows/danfse-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-layout:
    name: Generate reference and long-description PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: ./.github/actions/setup-project-php
        with:
          php-version: '8.3'
          extensions: openssl, dom, soap
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Generate synthetic PDFs for visual review
        run: php tools/bin/render-danfse-visual-fixtures.php "${{ runner.temp }}/danfse"

      - name: Verify printable receipt footer and long-description pagination
        shell: bash
        run: |
          for pdf in "${{ runner.temp }}/danfse/"*.pdf; do
            pdftotext -layout "$pdf" - | grep -Fq "DATA CIENTIFICAÇÃO"
            pdftotext -layout "$pdf" - | grep -Fq "IDENTIFICAÇÃO E ASSINATURA"
          done
          pages=$(pdfinfo "${{ runner.temp }}/danfse/danfse-long-description.pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" -gt 1

      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danfse-visual-evidence
          path: ${{ runner.temp }}/danfse/*.pdf
          if-no-files-found: error
