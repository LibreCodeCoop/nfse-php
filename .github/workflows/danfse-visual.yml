name: DANFSe Visual Evidence

on:
  pull_request:
    paths:
      - 'src/Danfse/**'
      - 'tests/fixtures/nfse_exemplo.xml'
      - 'tools/bin/render-danfse-visual-fixtures.php'
      - '.github/workflows/danfse-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-layout:
    name: Generate reference and long-description PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: ./.github/actions/setup-project-php
        with:
          php-version: '8.3'
          extensions: openssl, dom, soap
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Generate synthetic PDFs for visual review
        run: php tools/bin/render-danfse-visual-fixtures.php "${{ runner.temp }}/danfse"

      - name: Verify required fields and one-page A4 layout
        shell: bash
        run: |
          for pdf in "${{ runner.temp }}/danfse/"*.pdf; do
            pdftotext -layout "$pdf" - | grep -Fq "DATA CIENTIFICAÇÃO"
            pdftotext -layout "$pdf" - | grep -Fq "IDENTIFICAÇÃO E ASSINATURA"
            # Normalize PDF line wraps while still requiring the complete official disclosure.
            pdftotext -layout "$pdf" - | tr -s '[:space:]' ' ' | grep -Fq "Totais aproximados dos Tributos"
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            test "$pages" -eq 1
            pdfinfo "$pdf" | grep -Fq 'Page size:       595.28 x 841.89 pts (A4)'
          done
          pdftotext -layout "${{ runner.temp }}/danfse/danfse-long-description.pdf" - | grep -Fq '...'
          # A locally supplied TTF must be genuinely embedded (not silently
          # replaced by Helvetica). The probe font is freely licensed.
          pdffonts "${{ runner.temp }}/danfse/danfse-font-probe.pdf" | grep -Fq 'DejaVuSans'
          for pdf in "${{ runner.temp }}/danfse/"*.pdf; do
            case "$pdf" in *font-probe.pdf) continue;; esac
            fonts=$(pdffonts "$pdf")
            echo "$fonts" | grep -Fq 'LiberationSans'
            echo "$fonts" | awk 'NR>2 && $4 != "yes" { exit 1 }'
            if echo "$fonts" | grep -Eq 'Helvetica|Times|DejaVu'; then
              echo "Unexpected fallback font in $pdf" >&2
              exit 1
            fi
          done
          # Verify both Regular and Bold were selected and actually embedded.
          pdffonts "${{ runner.temp }}/danfse/danfse-reference.pdf" | grep -E 'LiberationSans' | grep -Eq 'Bold|Regular'


      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danfse-visual-evidence
          path: ${{ runner.temp }}/danfse/*.pdf
          if-no-files-found: error
