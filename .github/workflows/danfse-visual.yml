name: DANFSe Visual Evidence

on:
  pull_request:
    paths:
      - 'src/Danfse/**'
      - 'tests/fixtures/nfse_exemplo.xml'
      - 'tools/bin/render-danfse-visual-fixtures.php'
      - 'tools/bin/verify-danfse-composer-package.php'
      - 'tools/bin/verify-danfse-visual-fixtures.php'
      - 'tools/src/DanfsePdfEvidence.php'
      - 'tests/Unit/Danfse/DanfsePdfEvidenceTest.php'
      - 'composer.json'
      - '.github/workflows/danfse-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-layout:
    name: Generate reference and long-description PDFs (Dompdf ${{ matrix.dompdf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The general prefer-lowest job currently resolves Dompdf 3.x.
        # Exercise both declared major versions with real PDFs.
        dompdf: ['2', '3']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: ./.github/actions/setup-project-php
        with:
          php-version: '8.3'
          extensions: openssl, dom, soap
          ini-file: development
          ini-values: disable_functions=
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dependencies for selected Dompdf major
        run: composer update --with "dompdf/dompdf:^${{ matrix.dompdf }}.0" --with-all-dependencies --prefer-dist --no-progress

      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Verify bundled fonts and licenses in Composer distribution
        run: php tools/bin/verify-danfse-composer-package.php

      - name: Test PDF evidence verifier (positive and negative cases)
        run: vendor/bin/phpunit tests/Unit/Danfse/DanfsePdfEvidenceTest.php

      - name: Generate synthetic PDFs for visual review
        run: php tools/bin/render-danfse-visual-fixtures.php "${{ runner.temp }}/danfse"

      - name: Verify PDF evidence (same command as local development)
        run: php tools/bin/verify-danfse-visual-fixtures.php "${{ runner.temp }}/danfse"

      - name: Preserve render evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: danfse-visual-evidence-dompdf${{ matrix.dompdf }}
          path: ${{ runner.temp }}/danfse/*.pdf
          if-no-files-found: error
