name: Official NFS-e Source Watch

on:
  schedule:
    - cron: "17 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-published-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP from Composer
        uses: ./.github/actions/setup-project-php
        with:
          extensions: dom, mbstring, zip, gd, xml, xmlreader, xmlwriter, simplexml, fileinfo
      - name: Install isolated domain tooling
        run: composer --working-dir=vendor-bin/domains install --prefer-dist --no-progress --no-interaction
      - name: Compare official source checksums
        run: php tools/bin/domains.php watch --report="${{ runner.temp }}/nfse-sources-report.json"
      - name: Retain diff evidence without modifying the repository
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-nfse-source-check
          path: ${{ runner.temp }}/nfse-sources-report.json
          if-no-files-found: warn
          retention-days: 30
